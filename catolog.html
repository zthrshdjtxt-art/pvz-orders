<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WB-Style Каталог</title>
    <style>
        :root {
            --wb-purple: #5e3098;
            --wb-white: #ffffff;
            --wb-gray: #f5f5f5;
            --wb-border: #e0e0e0;
        }
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--wb-gray);
            color: #333;
        }

        /* Шапка как у Wildberries */
        header {
            background-color: var(--wb-white);
            padding: 12px 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .wb-logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--wb-purple);
            text-transform: uppercase;
        }
        .search-box {
            flex-grow: 1;
            max-width: 600px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--wb-border);
            border-radius: 4px;
            outline: none;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cart-btn {
            background: var(--wb-purple);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .cart-btn:hover { background: #4a267a; }

        /* Категории (имитация) */
        .categories {
            background: white;
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            overflow-x: auto;
        }
        .cat-item {
            white-space: nowrap;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--wb-border);
        }
        .cat-item:hover {
            border-color: var(--wb-purple);
        }

        /* Основной контейнер */
        main {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            margin-top: 20px;
            color: var(--wb-purple);
        }

        /* Сетка товаров */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Карточка товара */
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-4px);
        }
        .product-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #eee;
        }
        .card-body {
            padding: 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .product-name {
            font-size: 14px;
            line-height: 1.4;
            color: #222;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #e63946;
            margin-bottom: 12px;
        }
        .btn-buy {
            width: 100%;
            padding: 10px;
            background: var(--wb-purple);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-buy:hover {
            background: #4a267a;
        }

        /* Модальное окно (имитация корзины) */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: white; margin: 15% auto; padding: 30px;
            border-radius: 12px; width: 90%; max-width: 500px; text-align: center;
        }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="wb-logo">WB-Clone</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск по названию...">
        </div>
    </div>
    <div class="header-right">
        <button class="cart-btn" onclick="openCart()">Корзина</button>
    </div>
</header>

<div class="categories">
    <div class="cat-item">Все товары</div>
    <div class="cat-item">Еда</div>
    <div class="cat-item">Электроника</div>
    <div class="cat-item">Игрушки</div>
</div>

<main>
    <h1>Каталог товаров</h1>
    <p id="status" style="color: #666;">Загрузка товаров...</p>
    <div id="catalog-container" class="catalog-grid"></div>
</main>

<!-- Окно оформления заказа -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeCart()">&times;</span>
        <h2>Оформление заказа</h2>
        <p style="margin-bottom:15px;">Вы выбрали товары на сумму: <b id="totalSum">0 ₽</b></p>
        <p>Для оплаты свяжитесь с менеджером:</p>
        <p><b>Telegram: @твоё_имя</b> или <b>Discord: твой_ник</b></p>
        <p style="font-size:13px; color:#888; margin-top:10px;">Оплата через ЮMoney после связи с менеджером.</p>
        <br>
        <button class="btn-buy" onclick="confirmOrder()">Подтвердить заказ</button>
    </div>
</div>

<script>
    // Ссылка на твой файл catalog.pov
    const fileUrl = 'https://raw.githubusercontent.com/zthrshdjtxt-art/pvz-orders/master/catalog.pov';

    let products = [];
    let cart = [];

    async function loadProducts() {
        try {
            const response = await fetch(fileUrl);
            if (!response.ok) throw new Error('Файл не найден');
            const text = await response.text();
            const lines = text.trim().split('\n');

            lines.forEach(line => {
                const parts = line.trim().split('|');
                if (parts.length >= 4) {
                    const [id, name, price, img] = parts;
                    products.push({ id, name, price, img });
                }
            });

            renderProducts(products);
            document.getElementById('status').textContent = '';
        } catch (error) {
            console.error(error);
            document.getElementById('status').textContent = 'Ошибка загрузки: ' + error.message;
            document.getElementById('status').style.color = 'red';
        }
    }

    function renderProducts(items) {
        const container = document.getElementById('catalog-container');
        container.innerHTML = '';

        if (items.length === 0) {
            container.innerHTML = '<p>Товары не найдены. Добавь их через батник!</p>';
            return;
        }

        items.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${escapeHtml(product.img)}" alt="${escapeHtml(product.name)}" class="product-img" onerror="this.src='https://via.placeholder.com/280'">
                <div class="card-body">
                    <div class="product-name">${escapeHtml(product.name)}</div>
                    <div class="product-price">${escapeHtml(product.price)}</div>
                    <button class="btn-buy" onclick="addToCart('${product.id}', '${escapeHtml(product.name)}', '${escapeHtml(product.price)}')">В корзину</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Поиск
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(query));
        renderProducts(filtered);
    });

    // Корзина
    function addToCart(id, name, price) {
        cart.push({ id, name, price });
        alert('Товар добавлен в корзину!');
    }

    function openCart() {
        if (cart.length === 0) {
            alert('Корзина пуста');
            return;
        }
        document.getElementById('cartModal').style.display = 'block';
        updateCartTotal();
    }

    function closeCart() {
        document.getElementById('cartModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('cartModal');
        if (event.target == modal) closeCart();
    }

    function updateCartTotal() {
        let sum = 0;
        cart.forEach(item => {
            // Убираем ₽ и пробелы, чтобы посчитать сумму
            const num = parseFloat(item.price.replace(/[^0-9.]/g, ''));
            if (!isNaN(num)) sum += num;
        });
        document.getElementById('totalSum').textContent = sum.toLocaleString('ru-RU') + ' ₽';
    }

    function confirmOrder() {
        alert('Заказ оформлен! Менеджер свяжется с тобой для оплаты на ЮMoney.');
        cart = [];
        closeCart();
        location.reload();
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    loadProducts();
</script>

</body>
</html>
